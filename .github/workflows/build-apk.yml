name: Build APK

# Compila el APK de MiCompra automáticamente en la nube.
# El resultado queda disponible para descargar en la pestaña "Actions"
# de GitHub (sección "Artifacts" de cada ejecución).

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configurar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No hay secreto KEYSTORE_BASE64; el APK se firmará con la clave de debug y NO podrá actualizarse sobre instalaciones anteriores."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/micompra-release.jks
          cat > android/key.properties <<EOF
          storeFile=micompra-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK universal (sirve para cualquier móvil y emulador)
        run: flutter build apk --release

      - name: Build release APKs (por arquitectura, más ligeros)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: micompra-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
