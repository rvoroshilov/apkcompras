name: Build APK

# Compila el APK de MiCompra automáticamente en la nube.
# El resultado queda disponible para descargar en la pestaña "Actions"
# de GitHub (sección "Artifacts" de cada ejecución).

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: micompra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
